name: backend-ci

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/ci.yml"
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Run unit tests
        run: |
          cd backend
          pytest -q -m "not api and not ragas_optional"

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Run API tests
        run: |
          cd backend
          pytest -q tests/test_api_v1.py tests/test_api_v1_chunks.py tests/test_api_v1_extra.py tests/test_eval_api.py tests/test_eval_run_detail_api.py tests/test_health.py tests/test_rag_answer.py tests/test_rag_fallback.py tests/test_trace_header.py

  ragas-optional:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-ragas.txt
      - name: Run optional ragas hook tests
        run: |
          cd backend
          pytest -q -m "ragas_optional" tests/test_evaluation_ragas_hook.py

  ragas-strict-nightly:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps (strict)
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-ragas.txt
      - name: Run strict ragas test
        run: |
          cd backend
          pytest -q tests/test_evaluation_strict.py
